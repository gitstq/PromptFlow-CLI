[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptflow-cli"
version = "1.0.0"
description = "🚀 PromptFlow-CLI - Lightweight Terminal AI Prompt Workflow Orchestration & Version Management Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "gitstq", email = "gitstq@users.noreply.github.com"}
]
keywords = [
    "prompt", "ai", "llm", "cli", "workflow", "version-control",
    "prompt-engineering", "terminal", "tui", "automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0"
]

[project.scripts]
promptflow = "promptflow.cli:main"
pf = "promptflow.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/PromptFlow-CLI"
Documentation = "https://github.com/gitstq/PromptFlow-CLI#readme"
Repository = "https://github.com/gitstq/PromptFlow-CLI"
Issues = "https://github.com/gitstq/PromptFlow-CLI/issues"
Changelog = "https://github.com/gitstq/PromptFlow-CLI/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptflow*"]

[tool.setuptools.package-data]
promptflow = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
